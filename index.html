<meta charset="utf-8">
<title>Storm Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wow.css">

<header>
  <h1>STORM WATCH</h1>
  <div class="status">
    <span id="round">Storm 1 / 4</span>
    <span id="phase" class="badge">STANDBY</span>
    <span id="clock" title="Base clock: 1 game second = 1 hour">Day 1 · 00:00</span>
    <span id="timer">--</span>
    <span class="sci" title="Science stars">★ <b id="science">0</b></span>
    <button id="pause" title="Pause" aria-label="Pause or resume">⏸</button>
    <button id="mute" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  </div>
</header>
<div id="phasebar"><i></i></div>

<div id="stage">
  <canvas id="scene" width="2400" height="1280"></canvas>
  <div id="caption" role="status" aria-live="polite"></div>
  <div id="meet"></div>
  <div id="dossier"></div>
</div>

<div id="toolbar">
  <button id="call">📡 Call Mission Control</button>
  <button id="allShelter" hidden>🚨 Everyone to the shelter!</button>
  <div id="chips" aria-label="Space words explained"></div>
  <button id="logbtn" title="Cadet Logbook">📖 Logbook</button>
  <button id="srcbadge" title="Which NASA data this game uses">🛰️ Real NASA data</button>
</div>
<div id="outside" title="Real conditions at the Moon's south pole"></div>

<div id="crewbar"></div>

<div id="sysbar">
  <div class="power">
    <span>⚡ POWER <button class="jchip" data-term="kw">kW <i>?</i></button></span>
    <b><span id="pwrUsed">0</span> / <span id="pwrMax">0</span> kW</b>
    <div class="bar"><i id="pwrBar"></i></div>
  </div>
  <div id="systems"></div>
</div>

<div id="modal" class="modal"><div class="card" id="card"></div></div>

<script src="sfx.js"></script>
<script src="learn.js"></script>
<script src="vendor/dicebear.js"></script>
<script src="crew.js"></script>
<script src="scene.js"></script>
<script src="game.js"></script>
